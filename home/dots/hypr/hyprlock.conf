# Glyph lock — visual match for SDDM glyph theme

$accent = rgba(215, 25, 33, 1.0)
$font = Ndot
$symbolFont = JetBrainsMono Nerd Font
$bg = $HOME/.config/hyprlock/images/background.jpg
$avatar = $HOME/.config/hyprlock/images/avatar.jpg

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# Same wallpaper as SDDM
background {
    monitor =
    path = $bg
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

# Dark overlay (SDDM unlocked state = 0.45)
shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.45)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ── Clock (top-left) ──
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.4)
    font_size = 140
    font_family = $font
    position = 80, -80
    halign = left
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%a, %-d %b" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 0.35)
    font_size = 28
    font_family = $font
    position = 85, -230
    halign = left
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:3600000] printf '󱄅  %s' "$(hostname | tr '[:lower:]' '[:upper:]')"
    color = rgba(255, 255, 255, 0.3)
    font_size = 20
    font_family = $symbolFont
    position = 85, -275
    halign = left
    valign = top
    zindex = 2
}

# ── Login card ──
shape {
    monitor =
    size = 340, 300
    color = rgba(0, 0, 0, 0.55)
    rounding = 32
    border_size = 1
    border_color = rgba(255, 255, 255, 0.3)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Avatar left of username
image {
    monitor =
    path = $avatar
    size = 54
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.25)
    position = -90, 75
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] whoami | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = $font
    position = 25, 75
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.05)
    outer_color = rgba(255, 255, 255, 0.2)
    check_color = $accent
    fail_color = $accent
    font_color = rgba(255, 255, 255, 1.0)
    font_family = $font
    placeholder_text = <span foreground="##ffffff80">ENTER PASSWORD</span>
    fail_text = <span foreground="##D71921">WRONG PASSWORD</span>
    fade_on_empty = false
    rounding = 14
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}

# Session pill
shape {
    monitor =
    size = 180, 40
    color = rgba(255, 255, 255, 0.05)
    rounding = 20
    border_size = 1
    border_color = rgba(255, 255, 255, 0.15)
    position = -50, -75
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = HYPRLAND
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = $font
    position = -50, -75
    halign = center
    valign = center
    zindex = 3
}

# Login arrow (decorative)
shape {
    monitor =
    size = 50, 50
    color = $accent
    rounding = -1
    border_size = 0
    position = 95, -75
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = →
    color = rgba(255, 255, 255, 1.0)
    font_size = 26
    font_family = $font
    position = 95, -75
    halign = center
    valign = center
    zindex = 3
}

# ── Power buttons ──
shape {
    monitor =
    size = 48, 48
    color = rgba(0, 0, 0, 0.7)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.2)
    position = -170, 50
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl suspend
}

label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.5)
    font_size = 20
    font_family = $symbolFont
    position = -170, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl suspend
}

shape {
    monitor =
    size = 48, 48
    color = rgba(0, 0, 0, 0.7)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.2)
    position = -110, 50
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl reboot
}

label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.5)
    font_size = 20
    font_family = $symbolFont
    position = -110, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl reboot
}

shape {
    monitor =
    size = 48, 48
    color = rgba(0, 0, 0, 0.7)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.2)
    position = -50, 50
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl poweroff
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.5)
    font_size = 20
    font_family = $symbolFont
    position = -50, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl poweroff
}
