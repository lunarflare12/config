# Glyph lock — same layout as SDDM login

$font = Inter
$symbolFont = JetBrainsMono Nerd Font
$bg = $HOME/.config/hyprlock/images/background.jpg
$avatar = $HOME/.config/hyprlock/images/avatar.jpg

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $bg
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
    blur_size = 0
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +%-I:%M
    color = rgba(255, 255, 255, 0.40)
    font_size = 108
    font_family = $font
    position = 0, -72
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.36)
    font_size = 24
    font_family = $font
    position = 0, -188
    halign = center
    valign = top
    zindex = 2
}

image {
    monitor =
    path = $avatar
    size = 54
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.25)
    position = -70, 198
    halign = center
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] whoami
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = $font
    position = 24, 214
    halign = center
    valign = bottom
    zindex = 2
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.18)
    outer_color = rgba(10, 132, 255, 1.0)
    check_color = rgba(10, 132, 255, 0.9)
    fail_color = rgba(255, 69, 58, 0.95)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = $font
    placeholder_text = <span foreground="##ffffff80">Enter Password</span>
    fail_text = <span foreground="##FF453A">Incorrect password</span>
    fade_on_empty = true
    rounding = 18
    position = 0, 130
    halign = center
    valign = bottom
    zindex = 2
}

# Sleep / reboot / power — same corner as SDDM PowerMenu
shape {
    monitor =
    size = 48, 48
    rounding = 24
    color = rgba(0, 0, 0, 0.70)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.20)
    position = -218, 50
    halign = right
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = $symbolFont
    position = -218, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl suspend
}

shape {
    monitor =
    size = 48, 48
    rounding = 24
    color = rgba(0, 0, 0, 0.70)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.20)
    position = -150, 50
    halign = right
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰑐
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = $symbolFont
    position = -150, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl reboot
}

shape {
    monitor =
    size = 60, 60
    rounding = 30
    color = rgba(215, 25, 33, 1.0)
    position = -50, 50
    halign = right
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = $symbolFont
    position = -50, 50
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl poweroff
}
