# Sequoia lock — wallpaper, clock at top, user + password at bottom

$font = Excalifont
$symbolFont = JetBrainsMono Nerd Font
$bg = $HOME/.config/hyprlock/images/background.jpg
$avatar = $HOME/.config/hyprlock/images/avatar.jpg

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $bg
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 2
    blur_size = 7
    brightness = 0.82
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = $font
    position = 0, -80
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.88)
    font_size = 24
    font_family = $font
    position = 0, -190
    halign = center
    valign = top
    zindex = 2
}

image {
    monitor =
    path = $avatar
    size = 72
    rounding = -1
    border_size = 0
    position = 0, 168
    halign = center
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] whoami
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = $font
    position = 0, 132
    halign = center
    valign = bottom
    zindex = 2
}

input-field {
    monitor =
    size = 220, 36
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.18)
    outer_color = rgba(255, 255, 255, 0.0)
    check_color = rgba(10, 132, 255, 0.9)
    fail_color = rgba(255, 69, 58, 0.95)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = $font
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    fail_text = <span foreground="##FF453A">Incorrect password</span>
    fade_on_empty = false
    rounding = 18
    position = 0, 80
    halign = center
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = $symbolFont
    position = -28, 28
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl poweroff
}

label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = $symbolFont
    position = -68, 28
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl reboot
}

label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = $symbolFont
    position = -108, 28
    halign = right
    valign = bottom
    zindex = 3
    onclick = systemctl suspend
}
