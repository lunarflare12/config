[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=4
# MaxColumnWidth wrapping is unstable in qmlformat 6.11.2: it mis-indents
# function bodies on the first pass and only settles on a second run.
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=always
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
