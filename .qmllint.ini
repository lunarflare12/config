[General]
DisableDefaultImports=false
# 0 = any warning-level finding fails. Import/singleton noise is info via
# --import info + [Warnings] below; UnusedImports stays a hard warning.
MaxWarnings=0

# Categories left at "info" are reported but do not fail the check.
# Everything else keeps qmllint's default level, so a regression in a
# currently-clean category breaks `nix flake check`.
[Warnings]
# Quickshell declares PanelWindow, grouped "margins", and the Tray
# edges/gravity properties in C++ in a way qmllint cannot resolve.
UncreatableType=info
UnresolvedType=info
MissingType=info
# Singleton members (PopupManager.toggle, Session.*, Theme.*) are invisible
# to qmllint across import aliases — treat as info, not hard failures.
MissingProperty=info
IncompatibleType=info
# pragma Singleton types are listed in qmldir as plain modules; qmllint
# still emits "not declared as singleton" import noise across Core/Services.
Import=info
# Quickshell's Process.exited carries a QProcess::ExitStatus enum that
# has no QML-visible type.
BadSignalHandlerParameters=info
# Known debt: ~820 sites read outer-scope properties without an id
# prefix. Qualifying them needs "pragma ComponentBehavior: Bound",
# which changes delegate scoping, so it is a separate deliberate task.
UnqualifiedAccess=info
# Clean as of this config, so promote it to a hard failure.
UnusedImports=warning
