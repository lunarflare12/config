plugins:
  reconcile-git:
    shortCut: Ctrl-R
    confirm: false
    description: Flux reconcile source git
    scopes:
      - gitrepositories
    command: bash
    background: false
    args:
      - -c
      - >-
        flux reconcile source git
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K

  reconcile-hr:
    shortCut: Ctrl-R
    confirm: false
